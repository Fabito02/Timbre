[package]
name = "libtimbre"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ytmusic = { path = "crates/ytmusic" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.92"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
reqwest = { version = "0.13.5", features = ["stream"] }
futures-util = "0.3.34"
