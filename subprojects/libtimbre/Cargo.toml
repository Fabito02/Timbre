[package]
name = "libtimbre"
version = "0.1.0"
edition = "2024"

[lib]
name = "timbre"
crate-type = ["cdylib", "rlib"]

[dependencies]
ytmusicapi = "0.5.0"

tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "symphonia-all",
] }
reqwest = { version = "0.13", features = [
    "stream",
    "gzip",
    "json",
    "blocking",
] }
futures-util = "0.3"

regex = "1"
thiserror = "2"
tracing = "0.1"
sha1 = "0.10"

symphonia = { version = "0.5", features = ["mkv", "ogg"] }
opus = "0.3"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
stream-download = { version = "0.21.1", features = ["reqwest-rustls"] }
hls_client = "1.1.0"
rustypipe-botguard = "0.1.2"
libblur = "0.23"
image = "0.25.10"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 3
